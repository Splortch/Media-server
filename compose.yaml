services:
  media-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - server-data:/data
      - ${MEDIA_PATH:?Set MEDIA_PATH to an existing media directory}:/media:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  server-data:
