name: Agent automation tests
on:
  pull_request:
  push:
    branches: [main, feat/issue-to-pr-agent]
permissions:
  contents: read
jobs:
  policy:
    name: Automation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/tests/issue-to-pr.test.cjs
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
  required:
    name: Agent dispatch policy
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platforms
        env:
          RESULT: ${{ needs.policy.result }}
        run: test "$RESULT" = success
