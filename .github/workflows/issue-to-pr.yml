name: Issue to PR
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
# This serializes dispatch decisions, not the hosted agent runtime. The persistent
# agent:in-progress issue label holds the slot until human review/cancellation.
concurrency:
  group: issue-to-pr-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/agent implement' &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify authorization and assign one issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          ISSUE_TO_PR_ENABLED: ${{ vars.ISSUE_TO_PR_ENABLED }}
        run: node scripts/issue-to-pr.cjs
