name: Windows client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file clients/windows/native/Cargo.lock
      - run: cargo audit --file clients/windows/src-tauri/Cargo.lock
  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: python scripts/component-changes.py windows
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.changed == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          workspaces: |
            clients/windows/native -> target
            clients/windows/src-tauri -> target
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci --prefix frontend
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm test --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm run lint --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm audit --prefix clients/windows --audit-level=moderate
      - if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --manifest-path clients/windows/native/Cargo.toml --check
      - if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --locked --manifest-path clients/windows/native/Cargo.toml --all-targets -- -D warnings
      - if: steps.changes.outputs.changed == 'true'
        run: cargo test --locked --manifest-path clients/windows/native/Cargo.toml
      - name: Install cached FFmpeg and FFprobe
        if: steps.changes.outputs.changed == 'true'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        timeout-minutes: 10
        with:
          ffmpeg-version: '7.1.1'
      - name: Verify media test prerequisites
        if: steps.changes.outputs.changed == 'true'
        run: |
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is not available' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe is not available' }
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet build MediaServer.sln
      - if: steps.changes.outputs.changed == 'true'
        run: python scripts/test-native-client.py
      - if: steps.changes.outputs.changed == 'true'
        name: Build native executable and EXE/MSI installers
        working-directory: clients/windows
        run: npm run tauri -- build --bundles nsis,msi
      - if: steps.changes.outputs.changed == 'true'
        name: Smoke-test native application startup
        shell: pwsh
        run: |
          $client = Start-Process -FilePath 'clients/windows/src-tauri/target/release/media-server-windows-client.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($client.HasExited) { throw "Native client exited during startup: $($client.ExitCode)" }
          Stop-Process -Id $client.Id
      - if: success() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MediaServer-Windows-Client-v0.1.0-alpha.1-x64
          if-no-files-found: error
          path: |
            clients/windows/src-tauri/target/release/bundle/nsis/*.exe
            clients/windows/src-tauri/target/release/bundle/msi/*.msi
            clients/windows/src-tauri/target/release/media-server-windows-client.exe
