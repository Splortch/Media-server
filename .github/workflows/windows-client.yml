name: Windows client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      client_version:
        type: string
        required: true
      msi_version:
        type: string
        required: true
      artifact_name:
        type: string
        default: release-windows-client
permissions:
  contents: read
concurrency:
  group: windows-client-${{ github.workflow }}-${{ github.ref }}-${{ inputs.artifact_name || 'ci' }}
  cancel-in-progress: true
jobs:
  glib-security:
    name: ${{ inputs.client_version != '' && 'Release GLib regression' || 'GLib optimized regression' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/security/glib-variant-iter -> target
      - name: Install GLib test dependencies
        run: sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev
      - name: Verify the application and regression use the reviewed backport
        run: python3 scripts/check-glib-patch.py
      - name: Exercise all affected iterator operations with optimizations
        run: cargo test --release --locked --manifest-path tests/security/glib-variant-iter/Cargo.toml
  audit:
    name: ${{ inputs.client_version != '' && 'Release Rust audit' || 'Rust dependency audit' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny unsound --file clients/windows/native/Cargo.lock
      - run: cargo audit --deny unsound --file clients/windows/src-tauri/Cargo.lock
  windows:
    name: ${{ inputs.client_version != '' && 'Release Windows client' || 'Windows client' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          RELEASE_BUILD: ${{ inputs.client_version != '' }}
        run: |
          if ($env:RELEASE_BUILD -eq 'true') { 'changed=true' >> $env:GITHUB_OUTPUT }
          else { python scripts/component-changes.py windows }
      - name: Stamp independently versioned client and MSI
        if: inputs.client_version != ''
        env:
          CLIENT_VERSION: ${{ inputs.client_version }}
          MSI_VERSION: ${{ inputs.msi_version }}
        run: node scripts/stamp-windows-version.cjs
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/windows/package-lock.json
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.changed == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          workspaces: |
            clients/windows/native -> target
            clients/windows/src-tauri -> target
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci --prefix frontend
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm test --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm run lint --prefix clients/windows
      - if: steps.changes.outputs.changed == 'true'
        run: npm audit --prefix clients/windows --audit-level=moderate
      - if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --manifest-path clients/windows/native/Cargo.toml --check
      - if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --locked --manifest-path clients/windows/native/Cargo.toml --all-targets -- -D warnings
      - if: steps.changes.outputs.changed == 'true'
        run: cargo test --locked --manifest-path clients/windows/native/Cargo.toml
      - name: Cache pinned FFmpeg archive
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-8.1.2-essentials_build.zip
          key: windows-ffmpeg-8.1.2-db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
      - name: Install and verify FFmpeg and FFprobe
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/setup-ffmpeg.ps1
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet build MediaServer.sln
      - if: steps.changes.outputs.changed == 'true'
        run: python scripts/test-native-client.py
      - if: steps.changes.outputs.changed == 'true'
        name: Build native executable and EXE/MSI installers
        working-directory: clients/windows
        run: npm run tauri -- build --bundles nsis,msi
      - if: steps.changes.outputs.changed == 'true'
        name: Smoke-test native application startup
        shell: pwsh
        run: |
          $client = Start-Process -FilePath 'clients/windows/src-tauri/target/release/media-server-windows-client.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($client.HasExited) { throw "Native client exited during startup: $($client.ExitCode)" }
          Stop-Process -Id $client.Id
      - if: success() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'MediaServer-Windows-Client-v0.1.0-alpha.1-x64' }}
          if-no-files-found: error
          path: |
            clients/windows/src-tauri/target/release/bundle/nsis/*.exe
            clients/windows/src-tauri/target/release/bundle/msi/*.msi
            clients/windows/src-tauri/target/release/media-server-windows-client.exe
