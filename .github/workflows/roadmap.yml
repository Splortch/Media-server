name: Roadmap
on:
  push:
    branches: [main]
    paths: ['docs/roadmap.json', 'scripts/github-bootstrap.cjs', '.github/workflows/roadmap.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: roadmap
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const bootstrap = require('./scripts/github-bootstrap.cjs');
            await bootstrap({github, context, core});
