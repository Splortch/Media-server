name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore MediaServer.sln --locked-mode
      - run: dotnet build MediaServer.sln --no-restore -warnaserror
      - run: dotnet test MediaServer.sln --no-build --logger trx
      - run: dotnet tool restore
      - run: dotnet csharpier check backend
      - if: runner.os == 'Linux'
        run: python3 scripts/audit.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet build MediaServer.sln
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results/
  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q
      - run: docker build -f docker/Dockerfile -t media-server:ci .
      - name: Smoke-test container
        shell: bash
        run: |
          docker run -d --name media-ci --read-only --tmpfs /tmp -p 127.0.0.1:5050:5050 -v media-ci-data:/data media-server:ci
          trap 'docker logs media-ci; docker rm -f media-ci' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:5050/health; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:5050/health
          curl -fsS http://127.0.0.1:5050/ > /tmp/index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5050/api/media)" = 401
