name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure FFmpeg tools
        timeout-minutes: 5
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
          else
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg || {
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
            }
          fi
      - run: dotnet build MediaServer.sln
      - name: Verify generated API contract
        run: |
          EXPORT_CLIENT_OPENAPI="$PWD/shared/api/openapi-v1.json" dotnet test MediaServer.sln --no-build --filter FullyQualifiedName~ClientOpenApiMatchesTheRunningServer
          npm ci --prefix shared/api
          npm run generate --prefix shared/api
          git diff --exit-code -- shared/api/openapi-v1.json shared/api/src/generated.ts
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results/
  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config -q
      - run: docker build -f docker/Dockerfile -t media-server:ci .
      - name: Smoke-test container
        shell: bash
        run: |
          docker run -d --name media-ci --read-only --tmpfs /tmp -p 127.0.0.1:5050:5050 -v media-ci-data:/data media-server:ci
          trap 'docker logs media-ci; docker rm -f media-ci' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:5050/health; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:5050/health
          curl -fsS http://127.0.0.1:5050/ > /tmp/index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5050/api/media)" = 401
