name: Web client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        working-directory: .
        run: python3 scripts/component-changes.py web
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build
      - if: steps.changes.outputs.changed == 'true'
        run: npm test
      - if: steps.changes.outputs.changed == 'true'
        run: npm run lint
      - if: steps.changes.outputs.changed == 'true'
        run: npm run format:check
      - if: steps.changes.outputs.changed == 'true'
        run: npm audit --audit-level=moderate
