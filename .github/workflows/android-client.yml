name: Android client
on:
  push:
    branches: [main]
    paths: ['clients/android/**', 'shared/api/**', 'backend/**', 'scripts/*android*', 'scripts/tests/android-*', '.github/workflows/android-client.yml', 'global.json', 'Directory.Build.props']
  pull_request:
    paths: ['clients/android/**', 'shared/api/**', 'backend/**', 'scripts/*android*', 'scripts/tests/android-*', '.github/workflows/android-client.yml', 'global.json', 'Directory.Build.props']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Android release safety
        run: node --test scripts/tests/android-release.test.cjs
      - name: Check generated API models
        run: python3 scripts/generate-android-models.py --check
      - name: Build APKs and bundle; run JVM tests and Android lint
        working-directory: clients/android
        run: ./gradlew --no-daemon -PandroidBuildNumber=${{ github.run_number }} :app:assembleDebug :app:assembleDebugAndroidTest :core:testDebugUnitTest :app:assembleRelease :app:bundleRelease :app:lint
      - uses: actions/upload-artifact@v7
        with:
          name: android-build
          if-no-files-found: error
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/app/build/outputs/apk/androidTest/debug/*.apk
            clients/android/app/build/outputs/apk/release/*-unsigned.apk
            clients/android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            clients/android/core/build/reports/tests/
            clients/android/app/build/reports/lint-results-*
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: actions/download-artifact@v8
        with:
          name: android-build
          path: clients/android/app/build/outputs
      - run: dotnet restore MediaServer.sln --locked-mode
      - run: dotnet build MediaServer.sln --no-restore -warnaserror
      - name: Prepare synthetic playback and emulator acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK against the real backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/test-android-backend.py
  release:
    needs: [build, device]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-build
          path: clients/android/app/build/outputs
      - name: Package validated Android outputs with checksums
        env:
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/package-android.py
      - name: Publish a separate Android prerelease
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/publish-android.cjs')({github, context})
