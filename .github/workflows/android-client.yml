name: Android client
on:
  push:
    branches: [main]
    paths: ['clients/android/**', 'shared/api/**', 'backend/**', 'scripts/*android*', 'scripts/tests/android-*', '.github/workflows/android-client.yml', 'global.json', 'Directory.Build.props']
  pull_request:
    paths: ['clients/android/**', 'shared/api/**', 'backend/**', 'scripts/*android*', 'scripts/tests/android-*', '.github/workflows/android-client.yml', 'global.json', 'Directory.Build.props']
  workflow_dispatch:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Android release safety
        run: node --test scripts/tests/android-release.test.cjs
      - name: Check generated API models
        run: python3 scripts/generate-android-models.py --check
      - name: Build APKs and bundle; run JVM tests and Android lint
        working-directory: clients/android
        run: ./gradlew --no-daemon -PandroidBuildNumber=${{ inputs.build_number || github.run_number }} :app:assembleDebug :app:assembleDebugAndroidTest :core:testDebugUnitTest :app:assembleRelease :app:bundleRelease :app:lint
      - uses: actions/upload-artifact@v7
        with:
          name: android-build
          if-no-files-found: error
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/app/build/outputs/apk/androidTest/debug/*.apk
            clients/android/app/build/outputs/apk/release/*-unsigned.apk
            clients/android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            clients/android/core/build/reports/tests/
            clients/android/app/build/reports/lint-results-*
  device_matrix:
    name: Device API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: ['35', '37.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: actions/download-artifact@v8
        with:
          name: android-build
          path: clients/android/app/build/outputs
      - run: dotnet restore MediaServer.sln --locked-mode
      - run: dotnet build MediaServer.sln --no-restore -warnaserror
      - name: Prepare synthetic playback and emulator acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK against the real backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/test-android-backend.py
  device:
    # Preserve the existing required check name while gating every tested API.
    needs: device_matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all device API levels
        env:
          DEVICE_RESULT: ${{ needs.device_matrix.result }}
        run: test "$DEVICE_RESULT" = success
  package:
    needs: [build, device]
    if: inputs.build_number != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-build
          path: clients/android/app/build/outputs
      - name: Package validated Android outputs
        env:
          ANDROID_BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/package-android.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: artifacts/android/MediaServer-Android-*
          if-no-files-found: error
