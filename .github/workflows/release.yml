name: Automatic prereleases
on:
  workflow_run:
    workflows: [Backend server, Web client, Windows client, CI, Agent automation tests]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-client.yml'
      - 'scripts/*release*'
      - 'scripts/stamp-windows-version.cjs'
      - 'scripts/build-server-installer.py'
      - 'scripts/test-server-installer.ps1'
      - 'scripts/test-installed-server.py'
      - 'scripts/tests/test_server_installer.py'
      - 'scripts/tests/*release*'
      - 'release-resources/**'
      - 'backend/locks/**'
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the latest main commit only after all five main CI workflows pass'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: prerelease-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      server: ${{ steps.plan.outputs.server }}
      client: ${{ steps.plan.outputs.client }}
      msi: ${{ steps.plan.outputs.msi }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # workflow_run always loads trusted default-branch code. No upstream artifacts
      # or fork/PR code are executed in a privileged job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        id: plan
        with:
          script: |
            const {plan} = require('./scripts/release-plan.cjs');
            const result = await plan({github, context});
            for (const [name, value] of Object.entries(result)) core.setOutput(name, String(value));
            core.summary.addRaw(result.build ? `Build ${result.sha}; publish=${result.publish}` : 'Waiting for all exact-commit main checks, or already published.');
            await core.summary.write();
  server:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python scripts/check-release-locks.py
      - run: dotnet restore MediaServer.sln --locked-mode
      - run: dotnet test MediaServer.sln -c Release --no-restore
      - name: Publish self-contained server
        env:
          RID: ${{ matrix.rid }}
          SERVER_VERSION: ${{ needs.plan.outputs.server }}
        shell: bash
        run: dotnet publish backend/src/Api -c Release -r "$RID" --self-contained true -p:Version="$SERVER_VERSION" -p:RestoreLockedMode=true -o artifacts/server
      - name: Validate Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          foreach ($script in (Get-ChildItem release-resources/windows/*.ps1) + (Get-Item scripts/test-server-installer.ps1)) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Package and smoke-test the actual archive
        env:
          RID: ${{ matrix.rid }}
          SERVER_VERSION: ${{ needs.plan.outputs.server }}
        run: |
          python scripts/package-release.py server
          python scripts/smoke-release.py
      - name: Build and test the actual Windows server setup.exe
        if: runner.os == 'Windows'
        env:
          SERVER_VERSION: ${{ needs.plan.outputs.server }}
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $compiler)) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'NSIS installation failed' }
          }
          $env:MAKENSIS = $compiler
          python scripts/build-server-installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Server installer build failed' }
          ./scripts/setup-ffmpeg.ps1
          ./scripts/test-server-installer.ps1 -Installer (Resolve-Path "artifacts/packages/MediaServer-v$env:SERVER_VERSION-win-x64-setup.exe")
      - uses: actions/upload-artifact@v7
        with:
          name: release-server-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error
  windows-client:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/windows-client.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      client_version: ${{ needs.plan.outputs.client }}
      msi_version: ${{ needs.plan.outputs.msi }}
      artifact_name: release-windows-client
  docker:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Build and test the release image
        env:
          SERVER_VERSION: ${{ needs.plan.outputs.server }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          docker build -f docker/Dockerfile --build-arg VERSION="$SERVER_VERSION" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.version=$SERVER_VERSION" -t media-server:release .
          docker run -d --name release-smoke --read-only --tmpfs /tmp -p 127.0.0.1:5050:5050 -v release-smoke-data:/data media-server:release
          trap 'docker logs release-smoke; docker rm -f release-smoke' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:5050/health; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:5050/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5050/api/media)" = 401
          curl -fsS http://127.0.0.1:5050/ > /tmp/release-index.html
          grep -q 'id="root"' /tmp/release-index.html
          mkdir -p artifacts/container
          docker run --rm --entrypoint dpkg-query media-server:release -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' > artifacts/container/CONTAINER-PACKAGES.txt
          docker run --rm --entrypoint ffmpeg media-server:release -L > artifacts/container/FFMPEG-LICENSE.txt 2>&1
          docker save media-server:release -o artifacts/container/image.tar
          docker build --target corresponding-source --output type=local,dest=artifacts/container -f docker/Dockerfile --build-arg VERSION="$SERVER_VERSION" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-container
          path: |
            artifacts/container/CONTAINER-PACKAGES.txt
            artifacts/container/FFMPEG-LICENSE.txt
            artifacts/container/Container-Corresponding-Source.tar.gz
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: artifacts/container/image.tar
          if-no-files-found: error
          compression-level: 1
  assemble:
    name: Release packages
    needs: [plan, server, windows-client, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/downloads
      - name: Assemble named downloads, instructions and checksums
        env:
          SERVER_VERSION: ${{ needs.plan.outputs.server }}
          CLIENT_VERSION: ${{ needs.plan.outputs.client }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/package-release.py assemble
      - uses: actions/upload-artifact@v7
        with:
          name: release-downloads
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    needs: [plan, assemble]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        id: current
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            core.setOutput('current', String(data.commit.sha === process.env.SOURCE_SHA));
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.current == 'true'
        with:
          name: release-downloads
          path: artifacts/release
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.current == 'true'
        with:
          name: container-image
          path: artifacts/container
      - uses: docker/login-action@v4
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image
        if: steps.current.outputs.current == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          docker load -i artifacts/container/image.tar
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' media-server:release)" = "$SOURCE_SHA"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag media-server:release "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"
      - name: Upload complete prerelease and publish it
        id: release
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const published = await require('./scripts/publish-release.cjs')({github,context});
            core.setOutput('published', String(published));
      - name: Update alpha container channel
        if: steps.release.outputs.published == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag media-server:release "$IMAGE:alpha"
          docker push "$IMAGE:alpha"
