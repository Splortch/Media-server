name: Live reviewed CC0 catalog validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commons:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build MediaServer.sln
      - name: Validate real approved Commons CC0 transfer
        run: python3 scripts/test-commons-catalog.py
