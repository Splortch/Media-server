name: Playback validation
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/playback-browser.sh', '.github/workflows/playback-validation.yml', 'Directory.Build.props', 'global.json']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/playback-browser.sh', '.github/workflows/playback-validation.yml', 'Directory.Build.props', 'global.json']
  workflow_dispatch:
    inputs:
      hardware:
        description: Run on an operator-provisioned GPU runner (main only)
        type: boolean
        default: false
      encoder:
        description: Hardware encoder to validate
        type: choice
        options: [h264_nvenc, h264_qsv, h264_vaapi, h264_amf]
permissions:
  contents: read
concurrency:
  group: playback-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
      - run: dotnet restore backend/tools/PlaybackBenchmark --locked-mode
      - run: dotnet build backend/tools/PlaybackBenchmark --no-restore -warnaserror
      - name: Validate synthetic SDR, HEVC HDR and AV1 HDR conversions
        shell: bash
        run: |
          for scenario in sdr hevc-hdr av1-hdr; do
            dotnet run --no-build --project backend/tools/PlaybackBenchmark -- --scenario "$scenario" --output "artifacts/$scenario.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playback-software-results
          path: artifacts/*.json
  browsers:
    name: Browsers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            browsers: chromium firefox
            projects: --project=chromium --project=firefox
          - platform: macos
            os: macos-15
            browsers: webkit
            projects: --project=webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Ensure Linux synthetic media tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          fi
      - name: Ensure macOS synthetic media tooling
        if: runner.os == 'macOS'
        run: |
          brew list ffmpeg-full >/dev/null 2>&1 || brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: dotnet restore MediaServer.sln --locked-mode
      - run: dotnet build MediaServer.sln --no-restore -warnaserror
      - run: npm ci --prefix frontend
      - run: cd frontend && npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Measure network adaptation and browser decoder compatibility
        run: bash scripts/playback-browser.sh ${{ matrix.projects }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playback-browser-evidence-${{ matrix.platform }}
          path: frontend/benchmark-results/
  hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.hardware && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, media-validation]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate provisioned hardware without accepting software fallback
        shell: bash
        env:
          REQUESTED_ENCODER: ${{ inputs.encoder }}
        run: |
          dotnet restore backend/tools/PlaybackBenchmark --locked-mode
          dotnet build backend/tools/PlaybackBenchmark --no-restore -warnaserror
          for scenario in sdr hevc-hdr av1-hdr; do
            dotnet run --no-build --project backend/tools/PlaybackBenchmark -- --encoder "$REQUESTED_ENCODER" --require-hardware --scenario "$scenario" --output "artifacts/hardware-$scenario.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playback-hardware-results
          path: artifacts/hardware-*.json
