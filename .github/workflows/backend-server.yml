name: Backend server
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: python scripts/component-changes.py backend
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet restore MediaServer.sln --locked-mode
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet build MediaServer.sln --no-restore -warnaserror
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet test MediaServer.sln --no-build --logger trx
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet tool restore
      - if: steps.changes.outputs.changed == 'true'
        run: dotnet csharpier check backend
      - if: runner.os == 'Linux' && steps.changes.outputs.changed == 'true'
        run: python3 scripts/audit.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
