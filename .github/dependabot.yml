version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /clients/windows
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /shared/api
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /clients/windows/native
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /clients/windows/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /clients/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Compiler/plugins and SDK-sensitive libraries move in one reviewable proposal.
    # Gradle wrapper and SDK compatibility still require explicit review and green CI.
    groups:
      android-platform:
        patterns: ["com.android.*", "org.jetbrains.kotlin*", "androidx.compose:*", "androidx.core:core-ktx"]
      androidx:
        patterns: ["androidx.*"]
