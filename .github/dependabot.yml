version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /clients/windows
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /shared/api
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /clients/windows/native
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /clients/windows/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /clients/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # SDK/compiler migrations must update Gradle, AGP, Kotlin and SDK together.
    # Review these temporary compatibility ceilings in docs/development/ANDROID-UPDATES.md.
    ignore:
      - dependency-name: "com.android.*"
        versions: ["[9.0,)"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: ["[2.3,)"]
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: ["[2.3,)"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: ["[1.10,)"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        versions: ["[1.11,)"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: ["[2026,)"]
      - dependency-name: "androidx.core:core-ktx"
        versions: ["[1.18,)"]
    groups:
      android-gradle-plugin:
        patterns: ["com.android.*"]
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
