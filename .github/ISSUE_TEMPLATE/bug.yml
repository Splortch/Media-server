name: Bug report
description: Report a reproducible failure
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version, OS, browser, container and codecs
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove passwords, tokens, private filenames and paths.
