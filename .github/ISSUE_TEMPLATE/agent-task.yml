name: Agent implementation task
description: A focused task for a maintainer to approve and assign to the coding agent
title: 'Task: '
body:
  - type: markdown
    attributes:
      value: |
        Keep this task small enough for one reviewed PR. Do not include credentials or personal media.
        A maintainer must read the final task and post `/agent implement` after automation is enabled.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the existing behavior, desired result, and relevant files.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes using Markdown checkboxes.
      placeholder: '- [ ] A reproducible regression is fixed and covered by a test.'
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Give relevant test commands and the behavior they must verify.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Define allowed scope, exclusions, dependencies, and any security-sensitive behavior to preserve.
    validations:
      required: true
