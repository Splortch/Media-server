[package]
name = "media-server-windows-client"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
media-client-core = { path = "../native" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

# GTK3 needs the 0.18 API. Pin the reviewed two-expression soundness backport;
# patch its FFI/macro siblings together so all consumers share identical types.
# See docs/clients/GLIB-SECURITY.md before changing or removing these overrides.
[patch.crates-io]
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
gobject-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
gio-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-macros = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
