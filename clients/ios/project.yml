name: MediaServer
options:
  bundleIdPrefix: org.splortch
  deploymentTarget:
    iOS: '17.0'
packages:
  MediaCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  MediaServer:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MediaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.splortch.mediaserver.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Media Server
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your selected media server on your local network.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
schemes:
  MediaServer:
    build:
      targets:
        MediaServer: all
